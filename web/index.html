<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Календарь ЦСКА</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap">
  <script>
    try {
      if (localStorage.getItem("cska-theme") === "light") document.documentElement.dataset.theme = "light";
    } catch (error) {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef7fe;
      --ink: #0c1e38;
      --muted: #5a7a9a;
      --line: #c5dff6;
      --card: #f7faff;
      --red: #c8102e;
      --loss: #c8102e;
      --football: #c8102e;
      --hockey: #1d4e89;
      --basketball: #c45c12;
      --home: #1b7d38;
      --away: #8a6230;
      --draw: #1a56c4;
      --score-win: #1b7d38;
      --score-loss: #c8102e;
      --score-draw: #1a56c4;
      --side-home: #1b7d38;
      --side-away: #8a6230;
      --outside: #e7f3ff;
      --outside-num: #7a98b8;
      --match: #ffffff;
      --local: #e7f3ff;
      --nav-btn: #d3e9fe;
      --site-font: Roboto, sans-serif;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #090e15;
      --ink: #e7eef8;
      --muted: #8ea6c2;
      --line: #243040;
      --card: #10161e;
      --red: #e10600;
      --loss: #ff6d6d;
      --score-win: #4dce74;
      --score-loss: #ff6d6d;
      --score-draw: #7eb0ff;
      --side-home: #4dce74;
      --side-away: #e2b07a;
      --outside: #070b11;
      --outside-num: #6e88a8;
      --match: #172331;
      --local: #172331;
      --nav-btn: #1c2a3c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font: 15px/1.4 var(--site-font);
    }
    header {
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      color: #fff;
      min-height: 148px;
      padding: 16px 0;
      background:
        linear-gradient(90deg, rgba(5, 12, 24, 0.55) 0%, rgba(5, 12, 24, 0.18) 34%, rgba(5, 12, 24, 0.12) 68%, rgba(5, 12, 24, 0.5) 100%),
        url("banner.jpg") center 42% / cover no-repeat;
    }
    header h1 {
      position: relative;
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1;
    }
    .banner-inner {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px 28px;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .banner-sub {
      margin: 10px 0 0;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.2;
    }
    .banner-main, .crests { position: relative; z-index: 1; }
    .crests { display: flex; align-items: center; }
    .crests .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-right: 1px solid rgba(255, 255, 255, 0.45);
    }
    .crests .tile:last-child { border-right: 0; padding-right: 0; }
    .crests .tile:first-child { padding-left: 0; }
    .crests img { height: 68px; width: auto; display: block; }
    .crests a.tile { text-decoration: none; color: inherit; }
    main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 40px; }
    .nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      position: sticky;
      top: 0;
      z-index: 4;
      margin: 0 -16px 10px;
      padding: 8px 16px 10px;
      background: var(--bg);
    }
    .filters {
      justify-self: start;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .month-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .nav-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .theme {
      display: inline-flex;
      align-items: center;
      box-sizing: border-box;
      height: 36px;
      min-height: 36px;
      gap: 10px;
      padding: 0 14px 0 8px;
      white-space: nowrap;
      background: var(--nav-btn);
      color: var(--ink);
      border: 0;
      border-radius: 999px;
      font-weight: 650;
    }
    .theme .track {
      display: block;
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: #6e8aab;
      position: relative;
      flex: none;
    }
    html[data-theme="dark"] .theme .track { background: #9a3a3a; }
    .theme .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
      transition: transform 0.15s ease;
    }
    html[data-theme="dark"] .theme .knob { transform: translateX(18px); }
    .group { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    button[aria-pressed="true"]:not(.theme) { color: #fff; border-color: transparent; }
    #sports, #sides { align-items: center; gap: 8px; }
    #sports button, #sides button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: var(--nav-btn);
      box-shadow: none;
      opacity: 1;
      filter: none;
    }
    #sports button[aria-pressed="true"],
    #sides button[aria-pressed="true"] {
      background: var(--nav-btn);
      border-color: transparent;
    }
    #sports button img, #sides button img {
      width: auto;
      height: 26px;
      display: block;
      border-radius: 0;
      pointer-events: none;
      opacity: 0.45;
    }
    html:not([data-theme="dark"]) #sports button img,
    html:not([data-theme="dark"]) #sides button img {
      filter: brightness(0);
    }
    #sports button[aria-pressed="true"] img,
    #sides button[aria-pressed="true"] img { opacity: 1; }
    .months { display: flex; align-items: center; justify-content: center; gap: 10px; }
    #updated {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
    }
    .nav h2 { margin: 0; font-size: 22px; text-transform: uppercase; }
    .months button, #refresh {
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--nav-btn);
      border-color: var(--nav-btn);
      color: var(--ink);
    }
    .months button { text-transform: capitalize; }
    #refresh:disabled { opacity: 0.6; cursor: default; }
    .wrap { overflow-x: auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }
    .match { overflow-wrap: break-word; }
    @media (max-width: 760px) {
      .banner-inner { padding: 0 20px; }
      main { padding-left: 20px; padding-right: 20px; }
      header h1 { font-size: 30px; }
      .crests img { height: 48px; }
      .nav {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 8px;
        margin-left: -20px;
        margin-right: -20px;
        padding-left: 20px;
        padding-right: 20px;
      }
      .months { gap: 8px; }
      .nav h2 { white-space: nowrap; }
      .filters, .nav-actions { justify-self: center; }
      #updated { white-space: normal; }
      .weekday { display: none; }
      .grid { grid-template-columns: 1fr; }
      .cell { min-height: 0; }
    }
    .weekday {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 0 6px;
    }
    .cell {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 108px;
      padding: 0 6px 6px;
    }
    .cell.outside {
      background: var(--outside);
      border-color: transparent;
    }
    .cell.outside .daynum { color: var(--outside-num); font-weight: 600; }
    .cell.outside .match { opacity: 0.55; }
    .cell.today .daynum { outline: 2px solid var(--red); }
    .daynum {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 -6px 4px;
      padding: 4px 8px;
      background: var(--nav-btn);
      border-radius: 7px 7px 0 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .daynum-main { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .daynum-month, .daynum-wd { display: none; letter-spacing: 0.04em; }
    .daynum-month { font-weight: 650; text-transform: capitalize; }
    .daynum-wd { margin-left: auto; text-transform: uppercase; }
    .cell.today .daynum-n { color: var(--red); }
    @media (max-width: 760px) {
      .daynum-wd, .daynum-month { display: block; }
    }
    .match {
      display: block;
      position: relative;
      text-decoration: none;
      color: inherit;
      border-left: 3px solid var(--football);
      background: var(--match);
      border-radius: 4px;
      padding: 4px 36px 5px 6px;
      margin-top: 4px;
    }
    .match.local { background: var(--local); }
    .match.hockey { border-left-color: var(--hockey); }
    .match.basketball { border-left-color: var(--basketball); }
    .match .sport {
      flex: none;
      margin-left: auto;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.2;
      white-space: nowrap;
    }
    .match .foot {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
      height: 1.2em;
      margin-right: -32px;
    }
    .match .icon {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .match .icon img { height: 28px; width: auto; display: block; background: transparent; }
    .match .title { height: 45.6px; overflow: hidden; }
    .match .opp {
      font-size: 13px;
      font-weight: 650;
      line-height: 15.6px;
      max-height: 31.2px;
      overflow: hidden;
    }
    .match .score { font-size: 13px; font-weight: 700; line-height: 1.2; height: 1.2em; }
    .match .score-pending { color: var(--muted); font-weight: 650; }
    .match .side {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      height: 1.2em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: -32px;
    }
    .match .side-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .match .sub, .match .club-place, .match .time { font-size: 12px; color: var(--muted); line-height: 1.2; }
    .match .club-place { height: 14.4px; line-height: 14.4px; }
    .match .sub {
      height: 1.2em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: -30px;
    }
    .match .time {
      display: block;
      height: 1.2em;
      font-weight: 700;
      color: var(--ink);
    }
    .side-home, .side-moscow { color: var(--side-home); }
    .side-away { color: var(--side-away); }
    .match .comp {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
    }
    .score-win { color: var(--score-win); }
    .score-loss { color: var(--score-loss); }
    .score-draw { color: var(--score-draw); }
    footer { margin-top: 18px; color: var(--muted); font-size: 13px; }
    footer a { color: var(--hockey); }
  </style>
</head>
<body>
  <header>
    <div class="banner-inner">
    <div class="banner-main">
      <h1>ЦСКА</h1>
      <p class="banner-sub">Футбол. Хоккей. Баскетбол.</p>
    </div>
    <div class="crests">
      <a class="tile" href="https://pfc-cska.com/" target="_blank" rel="noreferrer"><img src="icons/football.svg" alt="ПФК ЦСКА"></a>
      <a class="tile" href="https://cska-hockey.ru/" target="_blank" rel="noreferrer"><img src="icons/hockey.svg" alt="ХК ЦСКА"></a>
      <a class="tile" href="https://cskabasket.ru/" target="_blank" rel="noreferrer"><img src="icons/basketball.svg" alt="ПБК ЦСКА"></a>
    </div>
    </div>
  </header>
  <main>
    <div class="nav">
      <div class="filters">
        <div class="group" id="sides">
          <button type="button" data-side="home" aria-pressed="true" aria-label="Дома"><img src="icons/side-home.png?v=4" alt=""></button>
          <button type="button" data-side="away" aria-pressed="true" aria-label="Выезд"><img src="icons/side-away.png?v=4" alt=""></button>
        </div>
        <div class="group" id="sports">
          <button type="button" data-sport="football" aria-pressed="true" aria-label="Футбол"><img src="icons/sport-football.png?v=4" alt=""></button>
          <button type="button" data-sport="hockey" aria-pressed="true" aria-label="Хоккей"><img src="icons/sport-hockey.png?v=4" alt=""></button>
          <button type="button" data-sport="basketball" aria-pressed="true" aria-label="Баскетбол"><img src="icons/sport-basketball.png?v=4" alt=""></button>
        </div>
      </div>
      <div class="month-block">
        <div class="months">
          <button type="button" id="prev">← месяц</button>
          <h2 id="label"></h2>
          <button type="button" id="next">месяц →</button>
        </div>
        <p id="updated">Загрузка…</p>
      </div>
      <div class="nav-actions">
        <button type="button" id="theme" class="theme" aria-pressed="true">
          <span class="track" aria-hidden="true"><span class="knob"></span></span>
          <span class="theme-label">Тема</span>
        </button>
        <button type="button" id="refresh">Обновить</button>
      </div>
    </div>
    <div class="wrap">
      <div class="grid" id="grid"></div>
    </div>
    <footer>
      Источники:
      <a href="https://pfc-cska.com/ru/matchi/kalendar-matchej/">ПФК ЦСКА</a>,
      <a href="https://cska-hockey.ru/calendar/">ХК ЦСКА</a>,
      <a href="https://cskabasket.ru/schedule/?all=Y">ПБК ЦСКА</a>.
      Файл для календаря телефона: <a href="calendar.ics">calendar.ics</a>.
    </footer>
  </main>
  <script>
    const ICONS = {
      football: '<img src="icons/football.svg" alt="">',
      hockey: '<img src="icons/hockey.svg" alt="">',
      basketball: '<img src="icons/basketball.svg" alt="">',
    };
    const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
    const WEEKDAYS = ["пн","вт","ср","чт","пт","сб","вс"];
    const sports = new Set(["football","hockey","basketball"]);
    const sides = new Set(["home","away"]);
    let matches = [];
    let cursor = todayParts();

    const themeButton = document.getElementById("theme");
    applyTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark");
    themeButton.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem("cska-theme", next); } catch (error) {}
    });

    document.getElementById("sports").addEventListener("click", (event) => toggle(event, sports, "sport"));
    document.getElementById("sides").addEventListener("click", (event) => toggle(event, sides, "side"));
    document.getElementById("prev").addEventListener("click", () => shift(-1));
    document.getElementById("next").addEventListener("click", () => shift(1));
    document.getElementById("refresh").addEventListener("click", refreshCalendar);
    loadMatches();

    function loadMatches() {
      return fetch("matches.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(String(response.status));
          return response.json();
        })
        .then((payload) => {
          matches = payload.matches || [];
          const updated = payload.updated_at ? new Date(payload.updated_at) : null;
          document.getElementById("updated").textContent = updated
            ? "Обновлено " + updated.toLocaleString("ru-RU", { timeZone: "Europe/Moscow" })
            : "Календарь собран";
          render();
        })
        .catch(() => {
          document.getElementById("updated").textContent = "Нет matches.json. Сначала запустите python -m cska";
        });
    }

    function refreshCalendar() {
      const button = document.getElementById("refresh");
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = "Обновление…";
      fetch("/refresh", { method: "POST" })
        .then((response) => {
          if (!response.ok && response.status !== 502) throw new Error(String(response.status));
          return loadMatches();
        })
        .catch(() => {
          document.getElementById("updated").textContent = "Не удалось обновить";
        })
        .finally(() => {
          button.disabled = false;
          button.textContent = "Обновить";
        });
    }

    function applyTheme(theme) {
      const dark = theme === "dark";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      themeButton.setAttribute("aria-pressed", dark ? "true" : "false");
      themeButton.querySelector(".theme-label").textContent = "Тема";
    }

    function toggle(event, bag, attr) {
      const button = event.target.closest("button");
      if (!button) return;
      const value = button.dataset[attr];
      if (bag.has(value)) bag.delete(value);
      else bag.add(value);
      button.setAttribute("aria-pressed", bag.has(value) ? "true" : "false");
      render();
    }

    function shift(delta) {
      const date = new Date(Date.UTC(cursor.year, cursor.month - 1 + delta, 1));
      cursor = { year: date.getUTCFullYear(), month: date.getUTCMonth() + 1 };
      render();
    }

    function monthName(delta) {
      const date = new Date(Date.UTC(cursor.year, cursor.month - 1 + delta, 1));
      return MONTHS[date.getUTCMonth()];
    }

    function render() {
      const label = document.getElementById("label");
      label.textContent = MONTHS[cursor.month - 1] + " " + cursor.year;
      document.getElementById("prev").textContent = monthName(-1);
      document.getElementById("next").textContent = monthName(1);
      const grid = document.getElementById("grid");
      grid.replaceChildren();
      for (const name of WEEKDAYS) {
        const cell = document.createElement("div");
        cell.className = "weekday";
        cell.textContent = name;
        grid.append(cell);
      }
      const first = new Date(cursor.year, cursor.month - 1, 1);
      const lead = (first.getDay() + 6) % 7;
      const days = new Date(cursor.year, cursor.month, 0).getDate();
      const today = todayKey();
      const visible = matches.filter((match) => sports.has(match.sport) && sides.has(match.home_away));
      const slots = Math.ceil((lead + days) / 7) * 7;
      const gridStart = dateKey(new Date(cursor.year, cursor.month - 1, 1 - lead));
      const gridEnd = dateKey(new Date(cursor.year, cursor.month - 1, slots - lead));
      for (let index = 0; index < slots; index += 1) {
        const date = new Date(cursor.year, cursor.month - 1, 1 - lead + index);
        const key = dateKey(date);
        const outside = date.getMonth() !== cursor.month - 1;
        const cell = document.createElement("div");
        cell.className = "cell" + (outside ? " outside" : "");
        if (key === today) cell.classList.add("today");
        const num = document.createElement("div");
        num.className = "daynum";
        const main = document.createElement("span");
        main.className = "daynum-main";
        const n = document.createElement("span");
        n.className = "daynum-n";
        n.textContent = String(date.getDate());
        main.append(n);
        if (date.getDate() === 1) {
          const month = document.createElement("span");
          month.className = "daynum-month";
          month.textContent = MONTHS[date.getMonth()];
          main.append(month);
        }
        const wd = document.createElement("span");
        wd.className = "daynum-wd";
        wd.textContent = WEEKDAYS[(date.getDay() + 6) % 7];
        num.append(main, wd);
        cell.append(num);
        for (const match of visible) {
          if (placeKey(match, gridStart, gridEnd) !== key) continue;
          cell.append(card(match));
        }
        grid.append(cell);
      }
    }

    function card(match) {
      const link = document.createElement("a");
      const inMoscow = (match.home_away_label || "").includes("(Москва)");
      link.className = "match " + match.sport + (match.home_away === "home" || inMoscow ? " local" : "");
      link.href = match.source_url;
      link.target = "_blank";
      link.rel = "noreferrer";
      const lines = [
        emblem(match),
        titleBlock(match),
        scoreLine(match),
        sideLine(match),
        venueLine(match),
        timeLine(match),
        footLine(match),
      ];
      link.append(...lines.filter(Boolean));
      return link;
    }

    function emblem(match) {
      const icon = document.createElement("span");
      icon.className = "icon";
      icon.innerHTML = ICONS[match.sport] || "";
      return icon;
    }

    function titleBlock(match) {
      const node = document.createElement("div");
      node.className = "title";
      node.append(opponentLine(match), clubPlace(match));
      return node;
    }

    function opponentLine(match) {
      const node = document.createElement("div");
      node.className = "opp";
      node.textContent = match.club_name || match.opponent;
      return node;
    }

    function clubPlace(match) {
      const node = document.createElement("div");
      node.className = "club-place";
      node.textContent = match.club_place ? "(" + match.club_place + ")" : "";
      return node;
    }

    function scoreLine(match) {
      const node = document.createElement("div");
      node.className = "score";
      if (!match.score) {
        node.classList.add("score-pending");
        node.textContent = "- : -";
        return node;
      }
      const kind = match.result || scoreKind(match.score);
      if (kind) node.classList.add("score-" + kind);
      node.textContent = match.score;
      return node;
    }

    function timeLine(match) {
      const node = document.createElement("div");
      node.className = "time";
      node.textContent = match.time_label || "не определено";
      return node;
    }

    function footLine(match) {
      const row = document.createElement("div");
      row.className = "foot";
      const kind = competitionLabel(match);
      if (kind) {
        const mark = document.createElement("span");
        mark.className = "comp";
        mark.textContent = kind;
        row.append(mark);
      }
      const sport = document.createElement("span");
      sport.className = "sport";
      sport.textContent = match.sport_label;
      row.append(sport);
      return row;
    }

    function scoreKind(score) {
      const parts = String(score).split(":");
      if (parts.length !== 2 || !/^\d+$/.test(parts[0]) || !/^\d+$/.test(parts[1])) return "";
      const ours = Number(parts[0]);
      const theirs = Number(parts[1]);
      if (ours > theirs) return "win";
      if (ours < theirs) return "loss";
      return "draw";
    }

    function competitionLabel(match) {
      const name = (match.tournament || "").toLowerCase().replaceAll("ё", "е");
      if (name.includes("товарищ")) return "Контрольный";
      if (name.includes("плей-офф") || name.includes("плей офф") || name.includes("play-off") || name.includes("playoff")) return "Плей-офф";
      if (name.includes("кубок") || name.includes("cup")) return "Кубок";
      if (name.includes("рпл") || name.includes("кхл") || name.includes("ел втб") || name.includes("чемпионат")) return "Чемпионат";
      return "";
    }

    function sideLine(match) {
      const node = document.createElement("div");
      const label = match.home_away_label || "";
      const text = document.createElement("span");
      text.className = "side-text";
      const moscow = " (Москва)";
      if (label.endsWith(moscow)) {
        node.className = "side side-away";
        text.append(document.createTextNode(label.slice(0, -moscow.length) + " "));
        const city = document.createElement("span");
        city.className = "side-moscow";
        city.textContent = "(Москва)";
        text.append(city);
      } else {
        node.className = "side " + (match.home_away === "home" ? "side-home" : "side-away");
        text.textContent = label;
      }
      text.title = label;
      node.append(text);
      return node;
    }

    function venueLine(match) {
      const node = textLine("sub", match.venue || "арена не указана");
      node.title = node.textContent;
      return node;
    }

    function textLine(className, value) {
      const node = document.createElement("div");
      node.className = className;
      node.textContent = value;
      return node;
    }

    function placeKey(match, gridStart, gridEnd) {
      const from = match.starts_at ? match.starts_at.slice(0, 10) : match.date_from;
      const to = match.starts_at ? from : (match.date_to || match.date_from);
      if (!from || !to || to < gridStart || from > gridEnd) return "";
      return from < gridStart ? gridStart : from;
    }

    function dateKey(date) {
      return iso(date.getFullYear(), date.getMonth() + 1, date.getDate());
    }

    function iso(year, month, day) {
      return year + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
    }

    function todayParts() {
      const key = todayKey();
      const [year, month] = key.split("-").map(Number);
      return { year, month };
    }

    function todayKey() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Moscow",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).format(new Date());
    }
  </script>
</body>
</html>
